name: nhawow_mobile
description: NhaWOW mobile application converted from the ASP.NET MVC web project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  panorama_viewer: ^2.0.7
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.14.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/web_assets/Amenities/
    - assets/web_assets/Cities/
    - assets/web_assets/Guide/